name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '11 2 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: amd64
            rustflags: -Ctarget-cpu=x86-64
            cflags: -march=x86-64
          - os: ubuntu-24.04-arm
            artifact: arm64
          - os: macos-26
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      DAV2D_LIB_PATH: ${{ github.workspace }}/dav2d/build/src
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/dav2d/build/src
      LD_LIBRARY_PATH: ${{ github.workspace }}/dav2d/build/src
      RAV2D_NEON_OFF: ''
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      CFLAGS: ${{ matrix.cflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm libclang-dev
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm
      - name: Verify assembly matches the pinned submodule
        run: python3 tools/vendor_dav2d.py --check
      - name: Build the pinned C reference decoder
        run: |
          nice -n 10 meson setup dav2d/build dav2d --default-library=both -Denable_tests=true -Dtrim_dsp=false
          nice -n 10 ninja -C dav2d/build
      - name: C reference assembly tests
        run: nice -n 10 dav2d/build/tests/checkasm -v
      - name: Cross-build Linux NEON with a configured macOS submodule
        if: matrix.os == 'macos-26'
        run: |
          brew install zig
          nice -n 10 cargo install cargo-zigbuild --locked --version 0.24.0
          rustup target add aarch64-unknown-linux-gnu
          nice -n 10 cargo zigbuild --locked --release -p rav2d-cli --target aarch64-unknown-linux-gnu
      - name: Format
        if: matrix.os == 'ubuntu-22.04'
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo fmt --all --check
      - name: Test CI output checks
        if: matrix.os == 'ubuntu-22.04'
        run: |
          nice -n 10 python3 tools/ci/test_smoke.py
          nice -n 10 python3 tools/test_vendor_dav2d.py
      - name: Lint all targets
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Library tests (native)
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --lib -- --test-threads=1
      - name: Conformance (native)
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --test conformance
      - name: Library and conformance (NEON dispatch off)
        if: runner.arch == 'ARM64'
        env:
          RAV2D_NEON_OFF: all
        run: |
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --lib -- --test-threads=1
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --test conformance
      - name: Mixed NEON dispatch controls
        if: runner.arch == 'ARM64'
        run: |
          for kernels in 'put_8tap,prep_bilin,ipred,dc_add,row_clip,unknown' 'ipred_h,warp_affine,mask,sad,residual_add'; do
            RAV2D_NEON_OFF="$kernels" nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --lib -- neon simd::tests:: mc::tests::test_sad x8_transforms_match_scalar --test-threads=1
          done
      - name: Unit test the vendored NEON assembly
        if: runner.arch == 'ARM64'
        run: |
          mv dav2d/build/config.h dav2d/build/config.h.native
          trap 'mv dav2d/build/config.h.native dav2d/build/config.h; touch crates/rav2d/build.rs' EXIT
          touch crates/rav2d/build.rs
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --lib -- --list > target/vendored-neon-tests.txt
          grep -Fx 'mc_neon::neon::eight_tap_dispatch_uses_best_available_backend: test' target/vendored-neon-tests.txt
          grep -Fx 'ipred_neon::neon::neon_disable_controls: test' target/vendored-neon-tests.txt
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --lib -- neon simd::tests:: mc::tests::test_sad x8_transforms_match_scalar --test-threads=1
      - name: Fuzz regression inputs
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --test fuzz fuzz_regression_corpus_no_panic
      - name: Public API documentation examples
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked -p rav2d --doc
      - name: Build release CLI and test executables
        run: |
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo build --locked --release -p rav2d-cli
          nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked --release -p rav2d --lib --test conformance --test fuzz --no-run --message-format=json > target/test-artifacts.json
      - name: Release library tests
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked --release -p rav2d --lib -- --test-threads=1
      - name: Release conformance
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked --release -p rav2d --test conformance
      - name: Release fuzz regression inputs
        run: nice -n 10 env DYLD_LIBRARY_PATH="$DAV2D_LIB_PATH" cargo test --locked --release -p rav2d --test fuzz fuzz_regression_corpus_no_panic
      - name: Release CLI output
        run: python3 tools/ci/smoke.py target/release/rav2d
      - name: Package identical release artifacts for CPU testing
        if: runner.os == 'Linux'
        run: python3 tools/ci/artifacts.py --pack target/test-artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: portable-${{ matrix.artifact }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 3
      - name: Ubuntu 26.10 CLI compatibility
        if: matrix.artifact == 'amd64'
        run: docker run --rm --platform linux/amd64 -v "$PWD:$PWD" -w "$PWD" ubuntu:26.10 nice -n 10 target/release/rav2d crates/rav2d/tests/data/media/avm-v14.1.0-bus.64x64.l5.obu -t 1

  cpu-families:
    needs: test
    uses: ./.github/workflows/cpu.yml
    with:
      extended: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  standalone:
    name: standalone (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git symlinks (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify the library
        if: runner.os != 'Windows'
        run: nice -n 10 cargo package --locked -p rav2d
      - name: Package and verify the library (Windows, lower priority)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          cargo package --locked -p rav2d
          exit $LASTEXITCODE
      - name: Check packaged files and remove the submodule
        shell: bash
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/vendor_dav2d.py --package target/package/rav2d-*.crate
          rm -rf dav2d crates/rav2d/vendor/dav2d-asm
          cp -R target/package/rav2d-*/vendor/dav2d-asm crates/rav2d/vendor/
      - name: Build and unit test the standalone CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nice -n 10 cargo build --locked --release -p rav2d-cli
          nice -n 10 cargo test --locked -p rav2d-cli
      - name: Build and unit test the CLI (Windows, lower priority)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          cargo build --locked --release -p rav2d-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p rav2d-cli
          exit $LASTEXITCODE
      - name: Decode using the standalone library
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/ci/smoke.py "target/release/rav2d${{ runner.os == 'Windows' && '.exe' || '' }}"

  msrv:
    name: Rust 1.85 production build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: nice -n 10 cargo check --locked -p rav2d-cli

  musl:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and run static production CLI
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          nice -n 10 cargo build --locked --release -p rav2d-cli --target x86_64-unknown-linux-musl
          python3 tools/ci/smoke.py target/x86_64-unknown-linux-musl/release/rav2d

  known-gaps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: known decoder gap (${{ matrix.test }}, nonblocking)
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { binary: conformance-tests, test: pending_monochrome }
          - { binary: conformance-tests, test: pending_chroma_422 }
          - { binary: conformance-tests, test: pending_chroma_444 }
          - { binary: conformance-tests, test: pending_resize }
          - { binary: conformance-tests, test: pending_tiles }
          - { binary: conformance-tests, test: pending_coverage_multitile }
          - { binary: unit-tests, test: 'obu::tests::pending_sequence_profile_3' }
          - { binary: unit-tests, test: 'obu::tests::pending_sequence_profile_4' }
          - { binary: unit-tests, test: 'obu::tests::pending_sequence_profile_31' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable-arm64
          path: ci-artifacts
      - name: Assert independent reference output
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ci-artifacts/lib
        run: |
          chmod +x 'ci-artifacts/${{ matrix.binary }}'
          nice -n 10 'ci-artifacts/${{ matrix.binary }}' --list | grep -Fx '${{ matrix.test }}: test'
          nice -n 10 'ci-artifacts/${{ matrix.binary }}' '${{ matrix.test }}' --exact --ignored --nocapture
