name: fuzz

# A decoder parses untrusted input, so one fuzz run at porting time is not a
# safety story — the corpus has to keep growing against the code as it changes.
# This runs nightly, carries the corpus forward between runs through the cache,
# and fails loudly with the reproducer attached when a target dies.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to fuzz each target'
        required: false
        default: '900'

# Never run two sessions at once: they would race on the corpus cache and the
# loser's newly discovered inputs would be dropped.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        target: [decode, decode_settings]

    steps:
      # The conformance vectors live in the submodule and seed the corpus.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: nice -n 10 cargo install cargo-fuzz --locked

      # Rolling key: each run restores the newest corpus and saves a new entry,
      # so coverage accumulates instead of restarting from the seeds every night.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/rav2d/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.arch }}-${{ matrix.target }}-

      - name: Seed corpus from the conformance vectors
        run: crates/rav2d/fuzz/seed-corpus.sh ${{ matrix.target }}

      - name: Fuzz
        working-directory: crates/rav2d/fuzz
        env:
          # Via env, not interpolated into the command line: a workflow_dispatch
          # input is caller-controlled text, and libFuzzer would happily take
          # extra flags smuggled through it.
          DURATION: ${{ github.event.inputs.duration || '900' }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$DURATION" in
            ''|*[!0-9]*) echo "duration must be a whole number of seconds"; exit 1 ;;
          esac
          nice -n 10 cargo fuzz run "$TARGET" -- \
            -max_total_time="$DURATION" \
            -rss_limit_mb=4096 \
            -timeout=25 \
            -print_final_stats=1

      # Drop redundant inputs so the cached corpus stays small enough to restore
      # quickly. Runs even after a failure so the cache does not rot.
      - name: Minimize corpus
        if: always()
        working-directory: crates/rav2d/fuzz
        run: nice -n 10 cargo fuzz cmin ${{ matrix.target }} || true

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/rav2d/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.arch }}-${{ matrix.target }}-${{ github.run_id }}

      # The reproducer is the whole value of a failed run — keep it even though
      # the job is red.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ runner.arch }}-${{ matrix.target }}
          path: crates/rav2d/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      # A red scheduled run is easy to miss: the next night's run goes green
      # again whenever the fuzzer does not rediscover the input, and the crash
      # is forgotten. Open (or comment on) an issue so it stays visible until
      # the reproducer lands in tests/data/fuzz-regressions.
      - name: Report the crash in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="fuzz: $TARGET target crashed"
          body="The nightly fuzz run of \`$TARGET\` failed: $RUN_URL

          Download the \`fuzz-artifacts-$RUNNER_ARCH-$TARGET\` artifact, add the reproducer to
          \`crates/rav2d/tests/data/fuzz-regressions/\` (inputs from \`decode_settings\`
          go into its \`decode_settings/\` subdirectory), fix the panic and close this issue."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --body "$body"
          fi
